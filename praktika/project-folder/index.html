<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teachable Machine Image Classifier</title>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #label-container {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Нейросеть: Распознавание Объектов</h1>
  <input type="file" accept="image/*" onchange="loadImage(event)">
  <br><br>
  <img id="uploaded-image" width="300" style="display:none;">
  <div id="label-container"></div>

  <script>
    const URL = "./model/";
    let model, maxPredictions;

    async function init() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();
    }

    async function predict(imageElement) {
      const prediction = await model.predict(imageElement);
      const labelContainer = document.getElementById("label-container");
      labelContainer.innerHTML = "";
      prediction.forEach(p => {
        const result = `${p.className}: ${(p.probability * 100).toFixed(2)}%`;
        labelContainer.innerHTML += `<div>${result}</div>`;
      });
    }

    async function loadImage(event) {
      const img = document.getElementById("uploaded-image");
      img.src = URL.createObjectURL(event.target.files[0]);
      img.onload = async () => {
        img.style.display = "block";
        await predict(img);
      };
    }

    init();
  </script>
</body>
</html>
